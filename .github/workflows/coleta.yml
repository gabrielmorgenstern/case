name: Coleta e carga GLP

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coleta-glp
  cancel-in-progress: false

jobs:
  coletar:
    if: github.event_name == 'workflow_dispatch' || vars.COLETA_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Consultar APIs e gravar no Supabase
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: require
          PYTHONUNBUFFERED: '1'
        run: python integrar.py coletar --max-chamadas-fonte 80 --segundos-fonte 300 --intervalo-requisicoes 1
      - name: Publicar resumo da execução
        if: always()
        run: python scripts/resumo_actions.py
      - name: Preservar diagnóstico e capturas em caso de erro
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostico-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            relatorios/*.json
            dados/coletas/*.jsonl
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: false
